name: Bug report
description: Something in SwiftConcurrency does not work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Code that shows it
      description: The smallest program or test that reproduces the problem.
      render: swift
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SwiftConcurrency version
      description: A release tag or a commit.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Xcode, Swift and OS versions
      description: For example "Xcode 26.6, Swift 6.2, iOS 26.5 simulator".
    validations:
      required: true
