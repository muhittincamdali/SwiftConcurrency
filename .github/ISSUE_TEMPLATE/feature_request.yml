name: Feature request
description: Suggest a type or an option for SwiftConcurrency.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do in your app, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The API you would like
      description: A short code sample of how you would call it.
      render: swift
  - type: textarea
    id: alternatives
    attributes:
      label: What you use now
      description: Workarounds or other packages you have tried.
