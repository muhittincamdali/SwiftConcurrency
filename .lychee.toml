# Link check settings shared by every repository (links.yml writes this file when a repository
# has none). Keep the exclusions short and explain each one: a link that is excluded is a link
# nobody checks.

# Re-check a link at most once a day; the cache is kept between workflow runs.
cache = true
max_cache_age = "1d"
cache_exclude_status = "429, 500.."

max_concurrency = 8
max_retries = 3
timeout = 20

# Anchors (#section) in Markdown and HTML files must exist, so README buttons and the table of
# contents cannot point at a renamed heading.
include_fragments = "anchor-only"

# Only a 2xx answer, after redirects, passes. A 403 or 429 is reported too: an accepted 403 would
# also hide a page that was made private, and a rate-limited link is retried (max_retries) and
# never cached (cache_exclude_status), so the next run checks it again.
accept = ["200..=299"]

exclude_loopback = true
exclude_private = true
exclude_link_local = true

exclude = [
  # Sites that answer automated requests with 999 or a sign-in wall.
  '^https://(www\.)?linkedin\.com/',
  '^https://(www\.)?x\.com/',
  # Placeholder hosts used in code samples.
  '^https?://(www\.)?example\.(com|org|net)',
  '^https?://api\.example\.com',
  # Pull request and comparison pages that only exist after a push.
  '^https://github\.com/[^/]+/[^/]+/compare/',
]

# The READMEs link to this repository's own files on main (graphics in .github/brand, screenshots
# in docs/images, Package.swift, LICENSE, folders). A pull request cannot change main, so the
# checked-out files stand in for them: on main they are the same files, on a pull request they are
# the ones it adds or removes. The path is the workspace of GitHub-hosted runners; a local run
# passes the same two --remap options with its own path.
remap = [
  '^https://raw\.githubusercontent\.com/muhittincamdali/SwiftConcurrency/main/(.*)$ file:///home/runner/work/SwiftConcurrency/SwiftConcurrency/$1',
  '^https://github\.com/muhittincamdali/SwiftConcurrency/(?:blob|tree)/main/(.*)$ file:///home/runner/work/SwiftConcurrency/SwiftConcurrency/$1',
  # The article pages on GitHub Pages are built from the .docc articles by docs.yml after a push
  # to main, so a pull request that adds an article links to a page that is not online yet. Each
  # article URL is checked against its source file instead.
  # The documentation root is the same case until docs.yml has published the site for the first
  # time (GitHub Pages answers 404 before that). Remove this line once the site is online, so a
  # site that is down fails the check again.
  '^https://muhittincamdali\.github\.io/SwiftConcurrency/documentation/swiftconcurrency/$ file:///home/runner/work/SwiftConcurrency/SwiftConcurrency/Sources/SwiftConcurrency/SwiftConcurrency.docc/SwiftConcurrency.md',
  '^https://muhittincamdali\.github\.io/SwiftConcurrency/documentation/swiftconcurrency/gettingstarted$ file:///home/runner/work/SwiftConcurrency/SwiftConcurrency/Sources/SwiftConcurrency/SwiftConcurrency.docc/GettingStarted.md',
  '^https://muhittincamdali\.github\.io/SwiftConcurrency/documentation/swiftconcurrency/testingtimebasedcode$ file:///home/runner/work/SwiftConcurrency/SwiftConcurrency/Sources/SwiftConcurrency/SwiftConcurrency.docc/TestingTimeBasedCode.md',
  '^https://muhittincamdali\.github\.io/SwiftConcurrency/documentation/swiftconcurrency/cancellationandlimits$ file:///home/runner/work/SwiftConcurrency/SwiftConcurrency/Sources/SwiftConcurrency/SwiftConcurrency.docc/CancellationAndLimits.md',
]

exclude_path = [
  "node_modules",
  ".build",
  "build",
  "Pods",
]
